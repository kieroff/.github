name: Epic
description: A macro initiative that brings together multiple user stories
title: "[EPIC] "
labels: ["kind:epic"]
assignees: []

body:
  - type: textarea
    id: overview
    attributes:
      label: 🧾 Overview
      description: Describe the epic's scope
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: 🎯 Objective
      description: What problem or business value does this epic address?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 📦 Scope
      description: List the main deliverables
      placeholder: |
        - Feature A
        - Feature B
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 🚫 Out of Scope
      description: What is NOT included

  - type: textarea
    id: success_metrics
    attributes:
      label: 📊 Success Metrics
      description: How to measure success

  - type: textarea
    id: references
    attributes:
      label: 📎 References
      description: Links, docs, etc.
