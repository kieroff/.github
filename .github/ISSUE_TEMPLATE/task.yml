name: Task
description: Trabalho técnico ou operacional
title: "[TASK] "
labels: ["type:task"]
assignees: []

body:
  - type: textarea
    id: description
    attributes:
      label: 🧾 Descrição
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: 🎯 Objetivo
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 📂 Categoria
      options:
        - Feature
        - Improvement
        - Tech Debt
        - Refactor
        - Chore
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 🏗️ Layer
      options:
        - Frontend
        - Backend
        - Infra
        - Automation
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ Critérios de Aceitação
      placeholder: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: 🧠 Notas Técnicas

  - type: textarea
    id: dependencies
    attributes:
      label: 🔗 Dependências

  - type: textarea
    id: deliverables
    attributes:
      label: 📦 Entregáveis
      placeholder: |
        - [ ] Código
        - [ ] Testes
        - [ ] Documentação
