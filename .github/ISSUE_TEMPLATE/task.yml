name: Task
description: Technical or operational work
title: "[TASK] "
labels: ["kind:task"]
assignees: []

body:
  - type: textarea
    id: description
    attributes:
      label: 🧾 Description
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: 🎯 Objective
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 📂 Category
      options:
        - Feature
        - Improvement
        - Tech Debt
        - Refactor
        - Chore
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 🏗️ Layer
      options:
        - Frontend
        - Backend
        - Infra
        - Automation
        - Data
        - Integration
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ Acceptance Criteria
      placeholder: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: 🧠 Technical Notes

  - type: textarea
    id: dependencies
    attributes:
      label: 🔗 Dependencies

  - type: textarea
    id: deliverables
    attributes:
      label: 📦 Deliverables
      placeholder: |
        - [ ] Code
        - [ ] Tests
        - [ ] Documentation
